<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --sq-fill: #1C1917;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sq-fill: #F8F6F1;
      }
    }
    .sq-solid { fill: var(--sq-fill); }
    .sq-dim { fill: var(--sq-fill); opacity: 0.45; }
  </style>
  <rect class="sq-solid" x="2" y="2" width="12.5" height="12.5" rx="3" fill="#1C1917"/>
  <rect class="sq-dim" x="17.5" y="2" width="12.5" height="12.5" rx="3" fill="#1C1917" opacity="0.45"/>
  <rect class="sq-dim" x="2" y="17.5" width="12.5" height="12.5" rx="3" fill="#1C1917" opacity="0.45"/>
  <rect class="sq-solid" x="17.5" y="17.5" width="12.5" height="12.5" rx="3" fill="#1C1917"/>
</svg>
